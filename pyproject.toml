[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codegraphy-lite"
version = "1.0.3"
description = "Standalone open-source visual architecture graph and MCP server for Python and modern codebases"
readme = "README.md"
authors = [
    { name = "CodeGraphy Contributors", email = "oss@codegraphy.dev" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = [
    "architecture",
    "visualization",
    "graph",
    "ast",
    "mcp",
    "model-context-protocol",
    "claude",
    "cursor",
    "devtools",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
    "starlette>=0.27.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
]

[project.scripts]
codegraphy-lite = "codegraphy_lite.cli:main"
codegraphy-mcp = "codegraphy_lite.mcp:main"

[project.urls]
Homepage = "https://github.com/Vindettobkb/codegraphy-lite"
Documentation = "https://github.com/Vindettobkb/codegraphy-lite#readme"
Repository = "https://github.com/Vindettobkb/codegraphy-lite.git"

[tool.setuptools]
packages = ["codegraphy_lite"]

[tool.setuptools.package-data]
codegraphy_lite = [
    "web/**/*",
    "web/*",
    "web/assets/*",
]
